<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ツボッター</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="app-header">
  <div class="brand">ツボッター</div>
  <div class="header-user" id="headerUser">
    <div class="avatar" id="headerAvatar"></div>
    <div class="user-meta">
      <div class="nick" id="headerNick"></div>
      <div class="course" id="headerCourse"></div>
    </div>
    <button type="button" class="btn-outline" id="logoutBtn">ログアウト</button>
  </div>
</header>

<main>

  <section id="authSection" class="auth-wrap">
    <div class="auth-card">
      <h1 class="logo-title">ツボッター<span class="dot">。</span></h1>
      <p class="tagline">学校内限定のつながりを、もっと身近に。</p>

      <div class="seg-toggle" id="authToggle">
        <button type="button" class="seg active" data-mode="register">新規登録</button>
        <button type="button" class="seg" data-mode="login">ログイン</button>
      </div>

      <div id="authMessage" class="message"></div>

      <form id="registerForm" class="auth-form active">
        <div class="field">
          <label for="regId">学籍番号（6桁）</label>
          <input id="regId" inputmode="numeric" maxlength="6" placeholder="例）260001">
        </div>
        <div class="field">
          <label for="regNickname">ニックネーム</label>
          <input id="regNickname" maxlength="20" placeholder="例）つぼちゃん">
        </div>
        <div class="field-row">
          <div class="field">
            <label for="regDept">学科</label>
            <select id="regDept"></select>
          </div>
          <div class="field">
            <label for="regCourse">コース</label>
            <select id="regCourse"></select>
          </div>
        </div>
        <div class="field">
          <label for="regPw">パスワード</label>
          <input id="regPw" type="password" placeholder="4文字以上">
        </div>
        <button type="submit" class="btn-primary btn-block">はじめる</button>
      </form>

      <form id="loginForm" class="auth-form">
        <div class="field">
          <label for="loginId">学籍番号（6桁）</label>
          <input id="loginId" inputmode="numeric" maxlength="6" placeholder="例）260001">
        </div>
        <div class="field">
          <label for="loginPw">パスワード</label>
          <input id="loginPw" type="password" placeholder="パスワード">
        </div>
        <button type="submit" class="btn-primary btn-block">ログイン</button>
      </form>

      <p class="footnote">※本サービスは本校の在学生のみご利用いただけます。</p>
    </div>
  </section>

  <section id="appSection" class="app-wrap">
    <div class="filter-row" id="filterRow"></div>

    <div class="composer">
      <textarea id="postText" maxlength="500" placeholder="いま何してる？学科のことを投稿しよう"></textarea>
      <div class="composer-footer">
        <div class="seg-toggle small" id="visibilityToggle">
          <button type="button" class="seg active" data-vis="public">公開</button>
          <button type="button" class="seg" data-vis="private">プライベート</button>
        </div>
        <div class="composer-actions">
          <span class="counter" id="charCounter">0/500</span>
          <button type="button" class="btn-primary" id="postBtn">投稿する</button>
        </div>
      </div>
      <div class="private-note" id="privateNote">🔒 プライベート投稿は自分にしか表示されません</div>
    </div>

    <div class="post-list" id="postList"></div>
  </section>

</main>

<script src="js/script.js"></script>
</body>
</html>

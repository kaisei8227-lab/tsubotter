spring:
  # H2データベース（開発用メモリDB）設定
  datasource:
    url: jdbc:h2:mem:tsubotterdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  # JPA / Hibernate の設定
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: true
    defer-datasource-initialization: true

  # SQLファイルでの初期データ投入を許可
  sql:
    init:
      mode: always

  # H2コンソール（ブラウザからDB確認用）有効化
  h2:
    console:
      enabled: true
      path: /h2-console